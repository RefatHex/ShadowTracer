name: shadowtracer-lab

x-manager-build: &manager-build
  context: ../..
  dockerfile: deploy/lab/manager.Dockerfile
  args:
    INSTALL_DIR: ${SHADOWTRACER_INSTALL_DIR:-/var/ossec}

# Startup-race fix (Step 2 of the Phase 5C Step 0b gate, see
# PHASE5C_SIGMA.md §11/§12): every service below now has restart:
# unless-stopped, and every real infra dependency (kafka, postgres,
# ch-clickhouse-1/2, ch-keeper) got its own healthcheck so dependents can
# condition: service_healthy on it instead of service_started - a
# container being "started" never meant "ready to accept connections",
# which is exactly the race that killed correlate-1/2 and closer-1/2 on a
# cold `docker compose up -d` (both crashed on ClickHouse refusing
# connections before analysisd's own retry/backoff - now fixed in the
# application code too - ever got a chance to run). restart:
# unless-stopped is still kept as the real backstop: even with every
# healthcheck and ordering correct, nothing here guarantees a dependency
# can't go unhealthy again later at runtime (a restart, an OOM) - a
# service exiting then must come back on its own, not sit Exited until
# someone notices.

# Phase 3 follow-up 3: agents go through shadowtracer-lb, registered with
# a dynamic ("any") IP. Previously (Phase 1/2, see PHASE1_FINDINGS.md)
# classic Wazuh TCP secure mode failed to identify "any"-registered agents
# behind a shared-IP load balancer - traced in Phase 3 to a real bug
# (OS_IsValidIP()/isSingleHost() in src/shared/validate_op.c, see
# UPSTREAM.md), now fixed and re-verified: Phase 1 item 15 (20 events
# during a worker outage) re-run through the LB, 20/20 delivered.
x-agent-env: &agent-env
  MANAGER_ENROLL_HOST: shadowtracer-master
  ENROLL_PASSWORD: ${ENROLL_PASSWORD:?set ENROLL_PASSWORD in deploy/lab/.env}
  SHADOWTRACER_INSTALL_DIR: ${SHADOWTRACER_INSTALL_DIR:-/var/ossec}

# Phase 4 Step 7: 2 byte-identical console backend replicas (same image,
# same env, nothing replica-specific) share this block - Caddy round-robins
# between them, and the console being stateless means it doesn't matter
# which one answers a given request.
x-console-backend-env: &console-backend-env
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in deploy/lab/.env}
  APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in deploy/lab/.env}
  POSTGRES_HOST: postgres
  POSTGRES_DB: ${POSTGRES_DB:-shadowtracer}
  CLICKHOUSE_HOST: ch-clickhouse-1
  # Dead-letter-ClickHouse incident (2026-10-08): /health/detail and
  # /health/ready's replica check need to query EVERY replica, not just
  # the one CLICKHOUSE_HOST above - see health.py's clickhouse_replica_health.
  CLICKHOUSE_HOSTS: ch-clickhouse-1:8123,ch-clickhouse-2:8123
  CLICKHOUSE_USER: ${CLICKHOUSE_USER:?set CLICKHOUSE_USER in deploy/lab/.env}
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in deploy/lab/.env}
  CLICKHOUSE_DATABASE: shadowtracer
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  KAFKA_WRITER_GROUP: shadowtracer-writer
  # Phase 5.6 Item 1: Describe-only credential (no topic Read/Write) -
  # /health/detail's lag reporting needs group offsets and topic
  # watermarks, never message content. See create-kafka-acls.sh.
  KAFKA_SECURITY_PROTOCOL: SASL_SSL
  KAFKA_SASL_USERNAME: console-backend
  KAFKA_SASL_PASSWORD: ${KAFKA_CONSOLE_BACKEND_PASSWORD:?set KAFKA_CONSOLE_BACKEND_PASSWORD in deploy/lab/.env}
  KAFKA_SSL_CA_LOCATION: /etc/kafka-certs/ca.crt
  CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-https://localhost:8443}
  # Phase 4 follow-up 2: shipper/writer are services on this same compose
  # network now, not host processes - reached by service name directly,
  # no host.docker.internal needed any more.
  SHIPPER_METRICS_URLS: http://shipper-worker1:9101,http://shipper-worker2:9101

# Phase 4 follow-up 2: one shipper container per manager node, reading
# that node's alerts volume read-only - it has no business writing to it.
# TENANT_ID is the tenant's permanent tenant_key (follow-up 1), printed by
# `cli.py create-admin`, never the display-only tenant name.
x-shipper-env: &shipper-env
  TENANT_ID: ${TENANT_KEY:?set TENANT_KEY in deploy/lab/.env, see .env.example}
  ALERTS_PATH: ${SHADOWTRACER_INSTALL_DIR:-/var/ossec}/logs/alerts/alerts.json
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  # Phase 5.6 Item 1: no KAFKA_TOPIC any more - derived from TENANT_ID
  # (topics.py). Producer-only credential, scoped to this tenant's own
  # two topics (create-kafka-acls.sh) - never another tenant's.
  KAFKA_SECURITY_PROTOCOL: SASL_SSL
  KAFKA_SASL_USERNAME: shipper
  KAFKA_SASL_PASSWORD: ${KAFKA_SHIPPER_PASSWORD:?set KAFKA_SHIPPER_PASSWORD in deploy/lab/.env}
  KAFKA_SSL_CA_LOCATION: /etc/kafka-certs/ca.crt
  # On the /offsets volume, not /tmp - must survive a container restart or
  # the shipper would re-read (and re-ship) its entire backlog every time.
  OFFSET_FILE: /offsets/offsets.json
  # No single event may stop the pipeline: a dead-lettered line always
  # goes to the Kafka dead-letter topic regardless of these - they only
  # add the queryable per-tenant count on /health/detail.
  CLICKHOUSE_HOST: ch-clickhouse-1
  CLICKHOUSE_USER: ${CLICKHOUSE_USER:?set CLICKHOUSE_USER in deploy/lab/.env}
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in deploy/lab/.env}
  CLICKHOUSE_DATABASE: shadowtracer

# Phase 5C Step 0, item 3: the dedicated test manager's shipper - same
# shape as x-shipper-env, deliberately NOT sharing it, since the one field
# that must differ is TENANT_ID (TEST_TENANT_KEY, not TENANT_KEY) and a
# shared anchor would make that too easy to accidentally collapse back to
# one tenant in a future edit.
x-shipper-test-env: &shipper-test-env
  TENANT_ID: ${TEST_TENANT_KEY:?set TEST_TENANT_KEY in deploy/lab/.env, see .env.example}
  ALERTS_PATH: ${SHADOWTRACER_INSTALL_DIR:-/var/ossec}/logs/alerts/alerts.json
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  # Phase 5.6 Item 1: no KAFKA_TOPIC any more - derived from TENANT_ID
  # (topics.py). Its OWN credential (shipper-test), never shipper's -
  # scoped to TEST_TENANT_KEY's own two topics, never TENANT_KEY's.
  KAFKA_SECURITY_PROTOCOL: SASL_SSL
  KAFKA_SASL_USERNAME: shipper-test
  KAFKA_SASL_PASSWORD: ${KAFKA_SHIPPER_TEST_PASSWORD:?set KAFKA_SHIPPER_TEST_PASSWORD in deploy/lab/.env}
  KAFKA_SSL_CA_LOCATION: /etc/kafka-certs/ca.crt
  OFFSET_FILE: /offsets/offsets.json
  CLICKHOUSE_HOST: ch-clickhouse-1
  CLICKHOUSE_USER: ${CLICKHOUSE_USER:?set CLICKHOUSE_USER in deploy/lab/.env}
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in deploy/lab/.env}
  CLICKHOUSE_DATABASE: shadowtracer

# 2 writer replicas, same consumer group - Kafka splits the topic's
# partitions between them (VERIFY in PHASE4_CONSOLE.md).
x-writer-env: &writer-env
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  # Phase 5.6 Item 1: no KAFKA_TOPIC any more - subscribes by pattern
  # across every tenant's own topic (topics.py). Consumer (alerts
  # pattern) + producer (dead-letter pattern) credential - never
  # producer on alerts (create-kafka-acls.sh).
  KAFKA_GROUP_ID: shadowtracer-writer
  KAFKA_SECURITY_PROTOCOL: SASL_SSL
  KAFKA_SASL_USERNAME: writer
  KAFKA_SASL_PASSWORD: ${KAFKA_WRITER_PASSWORD:?set KAFKA_WRITER_PASSWORD in deploy/lab/.env}
  KAFKA_SSL_CA_LOCATION: /etc/kafka-certs/ca.crt
  CLICKHOUSE_HOSTS: ch-clickhouse-1:8123,ch-clickhouse-2:8123
  CLICKHOUSE_USER: ${CLICKHOUSE_USER:?set CLICKHOUSE_USER in deploy/lab/.env}
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in deploy/lab/.env}
  CLICKHOUSE_DATABASE: shadowtracer
  # Phase 5C Step 0: tenant-existence check (tenants.py) - a real Postgres
  # dependency the writer didn't have before.
  POSTGRES_HOST: postgres
  POSTGRES_DB: ${POSTGRES_DB:-shadowtracer}
  APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in deploy/lab/.env}
  # run_writer.py's own default (9102) differs from the shipper's (9101) -
  # the image's HEALTHCHECK always checks 9101 unless told otherwise, so
  # this must be explicit or the writer never reports healthy.
  METRICS_PORT: "9102"

# Phase 5A Step 1: 2 correlator replicas, same consumer group as a SECOND,
# independent group on the same events topic (never ClickHouse) - Kafka
# splits the 24 partitions between them the same way it does for
# writer-1/writer-2.
x-correlate-env: &correlate-env
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  # Phase 5.6 Item 1: no KAFKA_TOPIC any more - subscribes by pattern
  # across every tenant's own topic (topics.py). Own credential
  # (correlator), same consumer+producer shape as writer's.
  KAFKA_GROUP_ID: shadowtracer-correlate
  # Per-batch time breakdown in the logs (shadowtracer_correlate/profiling.py); off unless set.
  SHADOWTRACER_PROFILE_BATCHES: ${SHADOWTRACER_PROFILE_BATCHES:-0}
  KAFKA_SECURITY_PROTOCOL: SASL_SSL
  KAFKA_SASL_USERNAME: correlator
  KAFKA_SASL_PASSWORD: ${KAFKA_CORRELATOR_PASSWORD:?set KAFKA_CORRELATOR_PASSWORD in deploy/lab/.env}
  KAFKA_SSL_CA_LOCATION: /etc/kafka-certs/ca.crt
  POSTGRES_HOST: postgres
  POSTGRES_DB: ${POSTGRES_DB:-shadowtracer}
  APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in deploy/lab/.env}
  SESSION_GAP_SECONDS: "600"
  MAX_SPAN_SECONDS: "14400"
  # Phase 5C Step 0b - see run_correlator.py's own docstring for the
  # justification behind 30s.
  SEQUENCE_LATENESS_SECONDS: "30"
  METRICS_PORT: "9104"
  # No single event may stop the pipeline: a dead-lettered event always
  # goes to the Kafka dead-letter topic regardless of these - they only
  # add the queryable per-tenant count on /health/detail.
  CLICKHOUSE_HOST: ch-clickhouse-1
  CLICKHOUSE_USER: ${CLICKHOUSE_USER:?set CLICKHOUSE_USER in deploy/lab/.env}
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in deploy/lab/.env}
  CLICKHOUSE_DATABASE: shadowtracer

# 2 closer replicas - deliberately run more than one, same as the
# correlators, so the advisory-lock protection (closer.py) is exercised
# for real in the lab, not just in a unit test with 2 threads.
x-closer-env: &closer-env
  POSTGRES_HOST: postgres
  POSTGRES_DB: ${POSTGRES_DB:-shadowtracer}
  APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in deploy/lab/.env}
  CLICKHOUSE_HOST: ch-clickhouse-1
  CLICKHOUSE_USER: ${CLICKHOUSE_USER:?set CLICKHOUSE_USER in deploy/lab/.env}
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in deploy/lab/.env}
  CLICKHOUSE_DATABASE: shadowtracer
  SESSION_GAP_SECONDS: "600"
  # The lab's own docker network - see networks.lab.ipam below.
  INTERNAL_IP_RANGES: "172.28.0.0/24"
  CLOSER_POLL_INTERVAL_SECONDS: "30"
  METRICS_PORT: "9105"

# Lab memory budget: every service has mem_limit = memswap_limit (no container
# swap), sized from the peak measured under the 4,000/s load test plus ~30%; the
# total must stay under 13.5 GiB (WSL 16 GB minus 2.5 GB for builds and the OS).
# Table and method: shadowtracer/docs/DEV_SETUP.md "Lab memory budget".
services:
  shadowtracer-master:
    build: *manager-build
    image: shadowtracer-lab/manager:local
    hostname: shadowtracer-master
    init: true
    restart: unless-stopped
    mem_limit: 1216m
    memswap_limit: 1216m
    environment:
      CLUSTER_NODE_TYPE: master
      CLUSTER_NODE_NAME: master
      CLUSTER_KEY: ${CLUSTER_KEY:?set CLUSTER_KEY in deploy/lab/.env}
      ENROLL_PASSWORD: ${ENROLL_PASSWORD:?set ENROLL_PASSWORD in deploy/lab/.env}
      SHADOWTRACER_INSTALL_DIR: ${SHADOWTRACER_INSTALL_DIR:-/var/ossec}
    volumes: &manager-config-mounts
      - ./entrypoint-manager.sh:/entrypoint.sh:ro
      - ./healthcheck-manager.sh:/healthcheck.sh:ro
    ports:
      # Only the API goes to the host - 1514/1515 stay internal to the lab
      # network (the Windows host has had Hyper-V reserve those before).
      - "127.0.0.1:55000:55000"
    networks:
      lab:
        ipv4_address: 172.28.0.10

  shadowtracer-worker1:
    build: *manager-build
    image: shadowtracer-lab/manager:local
    hostname: shadowtracer-worker1
    init: true
    restart: unless-stopped
    mem_limit: 1216m
    memswap_limit: 1216m
    environment:
      CLUSTER_NODE_TYPE: worker
      CLUSTER_NODE_NAME: worker1
      CLUSTER_KEY: ${CLUSTER_KEY:?set CLUSTER_KEY in deploy/lab/.env}
      ENROLL_PASSWORD: ${ENROLL_PASSWORD:?set ENROLL_PASSWORD in deploy/lab/.env}
      SHADOWTRACER_INSTALL_DIR: ${SHADOWTRACER_INSTALL_DIR:-/var/ossec}
    volumes:
      - ./entrypoint-manager.sh:/entrypoint.sh:ro
      - ./healthcheck-manager.sh:/healthcheck.sh:ro
      # shipper-worker1 (Phase 4 follow-up 2) mounts this same host path
      # read-only and tails it from there.
      - ./alerts-worker1:${SHADOWTRACER_INSTALL_DIR:-/var/ossec}/logs/alerts
    depends_on:
      shadowtracer-master:
        condition: service_healthy
    networks:
      lab:
        ipv4_address: 172.28.0.11

  shadowtracer-worker2:
    build: *manager-build
    image: shadowtracer-lab/manager:local
    hostname: shadowtracer-worker2
    init: true
    restart: unless-stopped
    mem_limit: 1216m
    memswap_limit: 1216m
    environment:
      CLUSTER_NODE_TYPE: worker
      CLUSTER_NODE_NAME: worker2
      CLUSTER_KEY: ${CLUSTER_KEY:?set CLUSTER_KEY in deploy/lab/.env}
      ENROLL_PASSWORD: ${ENROLL_PASSWORD:?set ENROLL_PASSWORD in deploy/lab/.env}
      SHADOWTRACER_INSTALL_DIR: ${SHADOWTRACER_INSTALL_DIR:-/var/ossec}
    volumes:
      - ./entrypoint-manager.sh:/entrypoint.sh:ro
      - ./healthcheck-manager.sh:/healthcheck.sh:ro
      - ./alerts-worker2:${SHADOWTRACER_INSTALL_DIR:-/var/ossec}/logs/alerts
    depends_on:
      shadowtracer-master:
        condition: service_healthy
    networks:
      lab:
        ipv4_address: 172.28.0.12

  # Phase 5C Step 0, item 3: dedicated test manager - NOT pooled behind
  # shadowtracer-lb (only worker1/worker2 are), so only an agent explicitly
  # pointed at this hostname (agent-ubuntu-1, below) ever lands here. Its
  # shipper (shipper-worker-test) ships under TEST_TENANT_KEY, never
  # TENANT_KEY - this is what keeps smoke-test.sh's real SSH-burst and
  # hostile-input traffic out of the main lab tenant.
  #
  # Phase 6.1a: its OWN single-node cluster (TENANCY.md option A). Until
  # then it was a worker of shadowtracer-master, so the Wazuh cluster synced
  # the main tenant's client.keys, etc/rules and etc/lists onto the test
  # tenant's manager (THREAT_INTEL.md §1.7). Own cluster name and key, own
  # enrollment password, own authd: agent-ubuntu-1 enrolls here, not on
  # the master. Node name stays "worker-test" so alert identity
  # (cluster.node) is unchanged.
  shadowtracer-worker-test:
    build: *manager-build
    image: shadowtracer-lab/manager:local
    hostname: shadowtracer-worker-test
    init: true
    restart: unless-stopped
    mem_limit: 1216m
    memswap_limit: 1216m
    environment:
      CLUSTER_NAME: shadowtracer-test
      CLUSTER_NODE_TYPE: master
      CLUSTER_NODE_NAME: worker-test
      CLUSTER_MASTER_NAME: shadowtracer-worker-test
      CLUSTER_KEY: ${TEST_CLUSTER_KEY:?set TEST_CLUSTER_KEY in deploy/lab/.env}
      ENROLL_PASSWORD: ${TEST_ENROLL_PASSWORD:?set TEST_ENROLL_PASSWORD in deploy/lab/.env}
      # Load-test syslog input for deploy/load/generate_load.py --target
      # syslog (THROUGHPUT_BASELINE.md §2.1 used to add this by hand).
      # Test manager only; never set on a main-tenant manager.
      LOAD_TEST_SYSLOG_PORT: "5514"
      # The same input over TCP (no kernel drops; back-pressure instead).
      LOAD_TEST_SYSLOG_TCP_PORT: "5515"
      SHADOWTRACER_INSTALL_DIR: ${SHADOWTRACER_INSTALL_DIR:-/var/ossec}
    volumes:
      - ./entrypoint-manager.sh:/entrypoint.sh:ro
      - ./healthcheck-manager.sh:/healthcheck.sh:ro
      - ./alerts-worker-test:${SHADOWTRACER_INSTALL_DIR:-/var/ossec}/logs/alerts
    networks:
      lab:
        ipv4_address: 172.28.0.14

  # Agent event traffic (1514) load balancer. Kept running per the Step 2
  # spec, but agent traffic bypasses it - see the note above x-agent-env.
  shadowtracer-lb:
    image: haproxy:2.9-alpine
    hostname: shadowtracer-lb
    restart: unless-stopped
    mem_limit: 32m
    memswap_limit: 32m
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      shadowtracer-worker1:
        condition: service_healthy
      shadowtracer-worker2:
        condition: service_healthy
    # Phase 5.6 Item 9: no build/Dockerfile for this service (plain
    # haproxy:2.9-alpine image), so this goes here rather than in a
    # HEALTHCHECK instruction like every other service's. Confirms the
    # frontend is actually bound and accepting connections, same depth
    # as the frontend-only check this image's own `check` keyword
    # already does per-backend-server in haproxy.cfg.
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "1514"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks:
      lab:
        ipv4_address: 172.28.0.13

  agent-ubuntu-1:
    build:
      context: ../..
      dockerfile: deploy/lab/agent-ubuntu.Dockerfile
      args:
        INSTALL_DIR: ${SHADOWTRACER_INSTALL_DIR:-/var/ossec}
    image: shadowtracer-lab/agent-ubuntu:local
    hostname: agent-ubuntu-1
    init: true
    restart: unless-stopped
    mem_limit: 176m
    memswap_limit: 176m
    # Phase 5C-1: auditd needs this to load rules / enable the kernel
    # audit subsystem (confirmed directly - it starts but immediately
    # exits on "Error sending enable request (Operation not permitted)"
    # without it). CAP_AUDIT_WRITE is already in Docker's default set.
    cap_add:
      - AUDIT_CONTROL
      # Phase 6.1b: iptables NFLOG for the outbound connection log (AGENT_NETLOG).
      - NET_ADMIN
    environment:
      <<: *agent-env
      AGENT_NETLOG: "1"
      # Phase 5C Step 0, item 3: pointed directly at the dedicated test
      # manager, NOT shadowtracer-lb - this is the one agent smoke-test.sh's
      # real SSH-brute-force check uses, and it must never land on worker1
      # or worker2 (the main lab tenant's shippers) by way of the LB's
      # non-sticky reassignment (see PHASE5C_SIGMA.md §9/§12).
      AGENT_MANAGER_DATA_HOST: shadowtracer-worker-test
      # Phase 6.1a: enrollment too - the test tenant's manager is its own
      # cluster with its own authd and password, so this agent's key lives
      # only there, never in the main tenant's client.keys.
      MANAGER_ENROLL_HOST: shadowtracer-worker-test
      ENROLL_PASSWORD: ${TEST_ENROLL_PASSWORD:?set TEST_ENROLL_PASSWORD in deploy/lab/.env}
    volumes: &agent-config-mounts
      - ./entrypoint-agent.sh:/entrypoint.sh:ro
      - ./healthcheck-agent.sh:/healthcheck.sh:ro
    depends_on:
      shadowtracer-worker-test:
        condition: service_healthy
    networks:
      lab:
        ipv4_address: 172.28.0.21

  agent-ubuntu-2:
    build:
      context: ../..
      dockerfile: deploy/lab/agent-ubuntu.Dockerfile
      args:
        INSTALL_DIR: ${SHADOWTRACER_INSTALL_DIR:-/var/ossec}
    image: shadowtracer-lab/agent-ubuntu:local
    hostname: agent-ubuntu-2
    init: true
    restart: unless-stopped
    mem_limit: 176m
    memswap_limit: 176m
    cap_add:
      - AUDIT_CONTROL
    environment:
      <<: *agent-env
      AGENT_MANAGER_DATA_HOST: shadowtracer-lb
    volumes: *agent-config-mounts
    depends_on:
      shadowtracer-lb:
        condition: service_started
    networks:
      lab:
        ipv4_address: 172.28.0.22

  agent-rocky-1:
    build:
      context: ../..
      dockerfile: deploy/lab/agent-rocky.Dockerfile
      args:
        INSTALL_DIR: ${SHADOWTRACER_INSTALL_DIR:-/var/ossec}
    image: shadowtracer-lab/agent-rocky:local
    hostname: agent-rocky-1
    init: true
    restart: unless-stopped
    mem_limit: 176m
    memswap_limit: 176m
    cap_add:
      - AUDIT_CONTROL
    environment:
      <<: *agent-env
      AGENT_MANAGER_DATA_HOST: shadowtracer-lb
    volumes: *agent-config-mounts
    depends_on:
      shadowtracer-lb:
        condition: service_started
    networks:
      lab:
        ipv4_address: 172.28.0.23

  agent-rocky-2:
    build:
      context: ../..
      dockerfile: deploy/lab/agent-rocky.Dockerfile
      args:
        INSTALL_DIR: ${SHADOWTRACER_INSTALL_DIR:-/var/ossec}
    image: shadowtracer-lab/agent-rocky:local
    hostname: agent-rocky-2
    init: true
    restart: unless-stopped
    mem_limit: 176m
    memswap_limit: 176m
    cap_add:
      - AUDIT_CONTROL
    environment:
      <<: *agent-env
      AGENT_MANAGER_DATA_HOST: shadowtracer-lb
    volumes: *agent-config-mounts
    depends_on:
      shadowtracer-lb:
        condition: service_started
    networks:
      lab:
        ipv4_address: 172.28.0.24

  # --- Phase 3 data platform ---------------------------------------------

  kafka:
    image: apache/kafka:3.9.0
    hostname: kafka
    restart: unless-stopped
    mem_limit: 1152m
    memswap_limit: 1152m
    environment:
      CLUSTER_ID: "${KAFKA_CLUSTER_ID:?set KAFKA_CLUSTER_ID in deploy/lab/.env, see .env.example}"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: BROKER://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: BROKER://kafka:9092,EXTERNAL://127.0.0.1:9094
      # Phase 5.6 Item 1: both client-facing listeners (BROKER - every
      # in-network shipper/writer/correlate/console-backend; EXTERNAL -
      # every host-side script, pytest suite, VERIFY script) are
      # SASL_SSL now. CONTROLLER stays PLAINTEXT - KRaft's own internal
      # metadata-quorum protocol, single broker, never exposed to a host
      # port or carrying client data, so not in this item's threat model.
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: BROKER:SASL_SSL,CONTROLLER:PLAINTEXT,EXTERNAL:SASL_SSL
      KAFKA_INTER_BROKER_LISTENER_NAME: BROKER
      KAFKA_SASL_ENABLED_MECHANISMS: SCRAM-SHA-256
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: SCRAM-SHA-256
      KAFKA_SSL_KEYSTORE_LOCATION: /etc/kafka/certs/broker.p12
      KAFKA_SSL_KEYSTORE_PASSWORD: "${KAFKA_SSL_KEYSTORE_PASSWORD:?set KAFKA_SSL_KEYSTORE_PASSWORD in deploy/lab/.env}"
      KAFKA_SSL_KEY_PASSWORD: "${KAFKA_SSL_KEYSTORE_PASSWORD}"
      KAFKA_SSL_KEYSTORE_TYPE: PKCS12
      # Found the hard way: the broker is ALSO a TLS client to itself on
      # the inter-broker (BROKER) listener (self-registration, and any
      # future real multi-broker traffic) - PKIX path validation failed
      # outright without a truststore telling it to trust its own CA.
      # PEM, pointed straight at ca.crt - no PKCS12/JKS conversion needed
      # for a truststore (only a keystore needs the private-key format).
      KAFKA_SSL_TRUSTSTORE_LOCATION: /etc/kafka/certs/ca.crt
      KAFKA_SSL_TRUSTSTORE_TYPE: PEM
      # No client certificate required - SASL/SCRAM (above) is the
      # authentication mechanism; TLS here is encryption + a served cert
      # clients can verify, not client auth (docs/design/KAFKA_AUTH.md).
      KAFKA_SSL_CLIENT_AUTH: none
      # KRaft-native ACL authorizer. super.users bypasses every ACL
      # check - this project's one bootstrap/provisioning principal
      # (create-kafka-topics.sh/create-kafka-acls.sh's --command-config),
      # never a real pipeline component.
      KAFKA_AUTHORIZER_CLASS_NAME: org.apache.kafka.metadata.authorizer.StandardAuthorizer
      # User:ANONYMOUS is the principal an unauthenticated PLAINTEXT
      # connection presents as - found the hard way, real evidence, not
      # assumed: without this, enabling the authorizer at all broke
      # KRaft's OWN internal controller-registration traffic over the
      # (never externally exposed) CONTROLLER listener, which has no
      # SASL on it by design (see KAFKA_LISTENER_SECURITY_PROTOCOL_MAP's
      # own comment) - the single-node broker registering itself with
      # its own controller role got CLUSTER_AUTHORIZATION_FAILED and
      # crash-looped. Safe specifically because that listener is
      # docker-network-internal only, carries no client data, and isn't
      # in this item's threat model (same reasoning as leaving it
      # PLAINTEXT at all) - this is NOT a blanket "ANONYMOUS can do
      # anything" grant on the client-facing BROKER/EXTERNAL listeners,
      # which still enforce SASL_SSL and have no PLAINTEXT path in for
      # an ANONYMOUS principal to even reach.
      KAFKA_SUPER_USERS: "User:admin;User:ANONYMOUS"
      # Phase 5.6 Item 1: the JAAS entry every listener running the
      # SCRAM mechanism needs, found missing the hard way too -
      # "Could not find a 'KafkaServer' ... entry in the JAAS
      # configuration" crashed the broker outright on first boot
      # without this. BROKER (inter-broker listener) needs a real
      # username/password since the broker acts as a SASL CLIENT on it
      # too (fetches, registration) - reuses the admin credential
      # (already a super-user, already provisioned). EXTERNAL is
      # server-only from the broker's side (it only ever ACCEPTS client
      # connections there, never initiates one) - no credential needed,
      # just the module declaration, which activates SCRAM validation
      # against whatever's already been provisioned via kafka-configs.sh.
      KAFKA_LISTENER_NAME_BROKER_SCRAM-SHA-256_SASL_JAAS_CONFIG: 'org.apache.kafka.common.security.scram.ScramLoginModule required username="admin" password="${KAFKA_ADMIN_PASSWORD:?set KAFKA_ADMIN_PASSWORD in deploy/lab/.env}";'
      KAFKA_LISTENER_NAME_EXTERNAL_SCRAM-SHA-256_SASL_JAAS_CONFIG: 'org.apache.kafka.common.security.scram.ScramLoginModule required;'
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # Lab: 1 broker, so replication/ISR must be 1. Production (3 brokers)
      # uses the real defaults (3/2) - see shadowtracer/docs/DECISIONS.md.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms512m"
    volumes:
      - kafka-data:/var/lib/kafka/data
      - ./kafka-certs/broker.p12:/etc/kafka/certs/broker.p12:ro
      - ./kafka-certs/ca.crt:/etc/kafka/certs/ca.crt:ro
      - ./kafka-certs/admin-client.properties:/etc/kafka/certs/admin-client.properties:ro
    ports:
      - "127.0.0.1:9094:9094"
    # Startup race fix (Step 2): previously no healthcheck at all, so
    # nothing could ever depend_on kafka with condition: service_healthy -
    # every consumer was stuck with service_started, i.e. "the container
    # process launched", which for a JVM broker is well before it can
    # actually serve a bootstrap request.
    #
    # Phase 5.6 Item 1: --command-config authenticates this as the
    # "admin" super-user, same credential create-kafka-topics.sh/
    # create-kafka-acls.sh use via docker exec - the unauthenticated
    # plaintext check this replaced stopped working the moment SASL_SSL
    # became mandatory on every listener.
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092", "--command-config", "/etc/kafka/certs/admin-client.properties"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      lab:
        ipv4_address: 172.28.0.30

  ch-keeper:
    image: clickhouse/clickhouse-keeper:24.8
    hostname: ch-keeper
    restart: unless-stopped
    mem_limit: 256m
    memswap_limit: 256m
    volumes:
      - ./clickhouse/keeper/keeper_config.xml:/etc/clickhouse-keeper/keeper_config.xml:ro
      - ch-keeper-data:/var/lib/clickhouse
    # localhost, not "localhost" resolved via DNS - this image's resolver
    # returned ::1 first and clickhouse-keeper only listens on 0.0.0.0, so
    # a plain `nc -z localhost 9181` failed even when the port was up;
    # found testing this directly against the real container, not assumed.
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "9181"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    networks:
      lab:
        ipv4_address: 172.28.0.31

  ch-clickhouse-1:
    image: clickhouse/clickhouse-server:24.8
    hostname: ch-clickhouse-1
    restart: unless-stopped
    mem_limit: 2048m
    memswap_limit: 2048m
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:?set CLICKHOUSE_USER in deploy/lab/.env}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in deploy/lab/.env}
      CLICKHOUSE_DB: shadowtracer
    volumes:
      - ./clickhouse/config.d/zookeeper.xml:/etc/clickhouse-server/config.d/zookeeper.xml:ro
      - ./clickhouse/config.d/cluster.xml:/etc/clickhouse-server/config.d/cluster.xml:ro
      - ./clickhouse/config.d/resources.xml:/etc/clickhouse-server/config.d/resources.xml:ro
      - ./clickhouse/config.d/storage.xml:/etc/clickhouse-server/config.d/storage.xml:ro
      - ./clickhouse/config.d/durability.xml:/etc/clickhouse-server/config.d/durability.xml:ro
      - ./clickhouse/config.d/macros-1.xml:/etc/clickhouse-server/config.d/macros.xml:ro
      - ch1-data:/var/lib/clickhouse
    depends_on:
      ch-keeper:
        condition: service_healthy
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"
    # /ping is ClickHouse's own unauthenticated HTTP liveness endpoint -
    # confirmed directly (`docker exec ... wget -qO- http://localhost:8123/ping`
    # -> "Ok.") rather than assumed from the image docs.
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      lab:
        ipv4_address: 172.28.0.32

  ch-clickhouse-2:
    image: clickhouse/clickhouse-server:24.8
    hostname: ch-clickhouse-2
    restart: unless-stopped
    mem_limit: 2048m
    memswap_limit: 2048m
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:?set CLICKHOUSE_USER in deploy/lab/.env}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in deploy/lab/.env}
      CLICKHOUSE_DB: shadowtracer
    volumes:
      - ./clickhouse/config.d/zookeeper.xml:/etc/clickhouse-server/config.d/zookeeper.xml:ro
      - ./clickhouse/config.d/cluster.xml:/etc/clickhouse-server/config.d/cluster.xml:ro
      - ./clickhouse/config.d/resources.xml:/etc/clickhouse-server/config.d/resources.xml:ro
      - ./clickhouse/config.d/storage.xml:/etc/clickhouse-server/config.d/storage.xml:ro
      - ./clickhouse/config.d/durability.xml:/etc/clickhouse-server/config.d/durability.xml:ro
      - ./clickhouse/config.d/macros-2.xml:/etc/clickhouse-server/config.d/macros.xml:ro
      - ch2-data:/var/lib/clickhouse
    depends_on:
      ch-keeper:
        condition: service_healthy
    ports:
      - "127.0.0.1:8124:8123"
      - "127.0.0.1:9001:9000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      lab:
        ipv4_address: 172.28.0.33

  postgres:
    image: postgres:16-alpine
    hostname: postgres
    restart: unless-stopped
    mem_limit: 320m
    memswap_limit: 320m
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in deploy/lab/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/lab/.env}
      POSTGRES_DB: ${POSTGRES_DB:-shadowtracer}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      lab:
        ipv4_address: 172.28.0.34

  # --- Phase 4 follow-up 2: ingest pipeline as services ------------------

  shipper-worker1:
    build:
      context: ../..
      dockerfile: deploy/lab/ingest.Dockerfile
    image: shadowtracer-lab/ingest:local
    hostname: shipper-worker1
    command: ["python3", "run_shipper.py"]
    restart: unless-stopped
    mem_limit: 128m
    memswap_limit: 128m
    environment:
      <<: *shipper-env
      MANAGER_NAME: shadowtracer-worker1
    volumes:
      # Read-only - the shipper has no business writing to a manager's
      # alert log, only tailing it.
      - ./alerts-worker1:${SHADOWTRACER_INSTALL_DIR:-/var/ossec}/logs/alerts:ro
      - shipper-worker1-offsets:/offsets
      - ./kafka-certs/ca.crt:/etc/kafka-certs/ca.crt:ro
    depends_on:
      shadowtracer-worker1:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      lab:
        ipv4_address: 172.28.0.38

  shipper-worker2:
    build:
      context: ../..
      dockerfile: deploy/lab/ingest.Dockerfile
    image: shadowtracer-lab/ingest:local
    hostname: shipper-worker2
    command: ["python3", "run_shipper.py"]
    restart: unless-stopped
    mem_limit: 128m
    memswap_limit: 128m
    environment:
      <<: *shipper-env
      MANAGER_NAME: shadowtracer-worker2
    volumes:
      - ./alerts-worker2:${SHADOWTRACER_INSTALL_DIR:-/var/ossec}/logs/alerts:ro
      - shipper-worker2-offsets:/offsets
      - ./kafka-certs/ca.crt:/etc/kafka-certs/ca.crt:ro
    depends_on:
      shadowtracer-worker2:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      lab:
        ipv4_address: 172.28.0.39

  # Phase 5C Step 0, item 3: ships shadowtracer-worker-test's alerts under
  # TEST_TENANT_KEY (x-shipper-test-env), never TENANT_KEY - the only
  # shipper the dedicated test agent's traffic ever reaches.
  shipper-worker-test:
    build:
      context: ../..
      dockerfile: deploy/lab/ingest.Dockerfile
    image: shadowtracer-lab/ingest:local
    hostname: shipper-worker-test
    command: ["python3", "run_shipper.py"]
    restart: unless-stopped
    mem_limit: 128m
    memswap_limit: 128m
    environment:
      <<: *shipper-test-env
      MANAGER_NAME: shadowtracer-worker-test
    volumes:
      - ./alerts-worker-test:${SHADOWTRACER_INSTALL_DIR:-/var/ossec}/logs/alerts:ro
      - shipper-worker-test-offsets:/offsets
      - ./kafka-certs/ca.crt:/etc/kafka-certs/ca.crt:ro
    depends_on:
      shadowtracer-worker-test:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      lab:
        ipv4_address: 172.28.0.46

  # Phase 6.1b: threat-intel sync (feeds -> IOC store -> CDB lists + TI rules on
  # every tenant manager cluster, through the 6.1a safe reload wrapper). Network
  # calls to feeds happen here, on a schedule - never on the alert hot path.
  ti-sync:
    build:
      context: ../..
      dockerfile: deploy/lab/ti-sync.Dockerfile
    image: shadowtracer-lab/ti-sync:local
    restart: unless-stopped
    mem_limit: 128m
    memswap_limit: 128m
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-shadowtracer}
      POSTGRES_USER: shadowtracer_app
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in deploy/lab/.env}
      TI_SYNC_INTERVAL_SECONDS: "900"
      # Customer-supplied in the product; ShadowTracer's own key only in the lab.
      OTX_API_KEY: ${OTX_API_KEY:-}
      TI_CLUSTERS: >-
        [{"tenant_key": "${TENANT_KEY:?set TENANT_KEY in deploy/lab/.env}",
          "nodes": [["master", "shadowtracer-lab-shadowtracer-master-1"],
                    ["worker1", "shadowtracer-lab-shadowtracer-worker1-1"],
                    ["worker2", "shadowtracer-lab-shadowtracer-worker2-1"]]},
         {"tenant_key": "${TEST_TENANT_KEY:?set TEST_TENANT_KEY in deploy/lab/.env}",
          "nodes": [["worker-test", "shadowtracer-lab-shadowtracer-worker-test-1"]]}]
    volumes:
      # Lab transport for safe_reload.DockerNode (docker exec into the managers).
      # Root-equivalent on the host: lab only (backlog S10).
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - lab

  writer-1:
    build:
      context: ../..
      dockerfile: deploy/lab/ingest.Dockerfile
    image: shadowtracer-lab/ingest:local
    hostname: writer-1
    command: ["python3", "run_writer.py"]
    restart: unless-stopped
    mem_limit: 320m
    memswap_limit: 320m
    environment: *writer-env
    volumes:
      - ./kafka-certs/ca.crt:/etc/kafka-certs/ca.crt:ro
    depends_on:
      kafka:
        condition: service_healthy
      ch-clickhouse-1:
        condition: service_healthy
    networks:
      lab:
        ipv4_address: 172.28.0.40

  writer-2:
    build:
      context: ../..
      dockerfile: deploy/lab/ingest.Dockerfile
    image: shadowtracer-lab/ingest:local
    hostname: writer-2
    command: ["python3", "run_writer.py"]
    restart: unless-stopped
    mem_limit: 320m
    memswap_limit: 320m
    environment: *writer-env
    volumes:
      - ./kafka-certs/ca.crt:/etc/kafka-certs/ca.crt:ro
    depends_on:
      kafka:
        condition: service_healthy
      ch-clickhouse-1:
        condition: service_healthy
    networks:
      lab:
        ipv4_address: 172.28.0.41

  # --- Phase 5A: correlation engine --------------------------------------

  correlate-1:
    build:
      context: ../..
      dockerfile: deploy/lab/correlate.Dockerfile
    image: shadowtracer-lab/correlate:local
    hostname: correlate-1
    command: ["python3", "run_correlator.py"]
    restart: unless-stopped
    mem_limit: 288m
    memswap_limit: 288m
    environment: *correlate-env
    volumes:
      - ./kafka-certs/ca.crt:/etc/kafka-certs/ca.crt:ro
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      lab:
        ipv4_address: 172.28.0.42

  correlate-2:
    build:
      context: ../..
      dockerfile: deploy/lab/correlate.Dockerfile
    image: shadowtracer-lab/correlate:local
    hostname: correlate-2
    command: ["python3", "run_correlator.py"]
    restart: unless-stopped
    mem_limit: 288m
    memswap_limit: 288m
    environment: *correlate-env
    volumes:
      - ./kafka-certs/ca.crt:/etc/kafka-certs/ca.crt:ro
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      lab:
        ipv4_address: 172.28.0.43

  closer-1:
    build:
      context: ../..
      dockerfile: deploy/lab/correlate.Dockerfile
    image: shadowtracer-lab/correlate:local
    hostname: closer-1
    command: ["python3", "run_closer.py"]
    restart: unless-stopped
    mem_limit: 96m
    memswap_limit: 96m
    environment: *closer-env
    depends_on:
      postgres:
        condition: service_healthy
      ch-clickhouse-1:
        condition: service_healthy
    networks:
      lab:
        ipv4_address: 172.28.0.44

  closer-2:
    build:
      context: ../..
      dockerfile: deploy/lab/correlate.Dockerfile
    image: shadowtracer-lab/correlate:local
    hostname: closer-2
    command: ["python3", "run_closer.py"]
    restart: unless-stopped
    mem_limit: 96m
    memswap_limit: 96m
    environment: *closer-env
    depends_on:
      postgres:
        condition: service_healthy
      ch-clickhouse-1:
        condition: service_healthy
    networks:
      lab:
        ipv4_address: 172.28.0.45

  # --- Phase 4 console ------------------------------------------------

  console-backend-1:
    build:
      context: ../..
      dockerfile: deploy/lab/console-backend.Dockerfile
    image: shadowtracer-lab/console-backend:local
    hostname: console-backend-1
    restart: unless-stopped
    mem_limit: 160m
    memswap_limit: 160m
    environment: *console-backend-env
    volumes:
      - ./kafka-certs/ca.crt:/etc/kafka-certs/ca.crt:ro
    depends_on:
      postgres:
        condition: service_healthy
      ch-clickhouse-1:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      lab:
        ipv4_address: 172.28.0.35

  console-backend-2:
    build:
      context: ../..
      dockerfile: deploy/lab/console-backend.Dockerfile
    image: shadowtracer-lab/console-backend:local
    hostname: console-backend-2
    restart: unless-stopped
    mem_limit: 160m
    memswap_limit: 160m
    environment: *console-backend-env
    volumes:
      - ./kafka-certs/ca.crt:/etc/kafka-certs/ca.crt:ro
    depends_on:
      postgres:
        condition: service_healthy
      ch-clickhouse-1:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      lab:
        ipv4_address: 172.28.0.36

  caddy:
    build:
      context: ../..
      dockerfile: deploy/lab/console-caddy.Dockerfile
    image: shadowtracer-lab/console-caddy:local
    hostname: caddy
    restart: unless-stopped
    mem_limit: 96m
    memswap_limit: 96m
    depends_on:
      - console-backend-1
      - console-backend-2
    ports:
      - "127.0.0.1:8443:8443"
    networks:
      lab:
        ipv4_address: 172.28.0.37

networks:
  lab:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  kafka-data:
  ch-keeper-data:
  ch1-data:
  ch2-data:
  postgres-data:
  shipper-worker1-offsets:
  shipper-worker2-offsets:
  shipper-worker-test-offsets:
