name: shadowtracer-lab

x-manager-build: &manager-build
  context: ../..
  dockerfile: deploy/lab/manager.Dockerfile

# Agents connect directly to their assigned worker (see PHASE1_FINDINGS.md:
# classic Wazuh TCP secure mode identifies "any"-registered agents by the
# !<id>! dynamic-ID prefix, which this build's wazuh-agentd doesn't send -
# confirmed via packet capture - so remoted falls back to IP-based lookup,
# which can never disambiguate multiple agents sharing one address. That
# breaks agent traffic through a shared-IP load balancer. Agents are
# registered with their own static IP instead of "any", split 2-and-2
# directly across the two workers. shadowtracer-lb is kept running (Step 2
# still asked for it) but no agent traffic actually flows through it.
x-agent-env: &agent-env
  MANAGER_ENROLL_HOST: wazuh-master
  ENROLL_PASSWORD: ${ENROLL_PASSWORD:?set ENROLL_PASSWORD in deploy/lab/.env}

services:
  wazuh-master:
    build: *manager-build
    image: shadowtracer-lab/manager:local
    hostname: wazuh-master
    environment:
      CLUSTER_NODE_TYPE: master
      CLUSTER_NODE_NAME: master
      CLUSTER_KEY: ${CLUSTER_KEY:?set CLUSTER_KEY in deploy/lab/.env}
      ENROLL_PASSWORD: ${ENROLL_PASSWORD:?set ENROLL_PASSWORD in deploy/lab/.env}
    volumes: &manager-config-mounts
      - ./entrypoint-manager.sh:/entrypoint.sh:ro
      - ./healthcheck-manager.sh:/healthcheck.sh:ro
    ports:
      # Only the API goes to the host - 1514/1515 stay internal to the lab
      # network (the Windows host has had Hyper-V reserve those before).
      - "127.0.0.1:55000:55000"
    networks:
      lab:
        ipv4_address: 172.28.0.10

  wazuh-worker1:
    build: *manager-build
    image: shadowtracer-lab/manager:local
    hostname: wazuh-worker1
    environment:
      CLUSTER_NODE_TYPE: worker
      CLUSTER_NODE_NAME: worker1
      CLUSTER_KEY: ${CLUSTER_KEY:?set CLUSTER_KEY in deploy/lab/.env}
      ENROLL_PASSWORD: ${ENROLL_PASSWORD:?set ENROLL_PASSWORD in deploy/lab/.env}
    volumes: *manager-config-mounts
    depends_on:
      wazuh-master:
        condition: service_healthy
    networks:
      lab:
        ipv4_address: 172.28.0.11

  wazuh-worker2:
    build: *manager-build
    image: shadowtracer-lab/manager:local
    hostname: wazuh-worker2
    environment:
      CLUSTER_NODE_TYPE: worker
      CLUSTER_NODE_NAME: worker2
      CLUSTER_KEY: ${CLUSTER_KEY:?set CLUSTER_KEY in deploy/lab/.env}
      ENROLL_PASSWORD: ${ENROLL_PASSWORD:?set ENROLL_PASSWORD in deploy/lab/.env}
    volumes: *manager-config-mounts
    depends_on:
      wazuh-master:
        condition: service_healthy
    networks:
      lab:
        ipv4_address: 172.28.0.12

  # Agent event traffic (1514) load balancer. Kept running per the Step 2
  # spec, but agent traffic bypasses it - see the note above x-agent-env.
  shadowtracer-lb:
    image: haproxy:2.9-alpine
    hostname: shadowtracer-lb
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - wazuh-worker1
      - wazuh-worker2
    networks:
      lab:
        ipv4_address: 172.28.0.13

  agent-ubuntu-1:
    build:
      context: ../..
      dockerfile: deploy/lab/agent-ubuntu.Dockerfile
    image: shadowtracer-lab/agent-ubuntu:local
    hostname: agent-ubuntu-1
    environment:
      <<: *agent-env
      AGENT_MANAGER_DATA_HOST: wazuh-worker1
      AGENT_MANAGER_DATA_HOST_FALLBACK: wazuh-worker2
    volumes: &agent-config-mounts
      - ./entrypoint-agent.sh:/entrypoint.sh:ro
      - ./healthcheck-agent.sh:/healthcheck.sh:ro
    depends_on:
      wazuh-worker1:
        condition: service_healthy
    networks:
      lab:
        ipv4_address: 172.28.0.21

  agent-ubuntu-2:
    build:
      context: ../..
      dockerfile: deploy/lab/agent-ubuntu.Dockerfile
    image: shadowtracer-lab/agent-ubuntu:local
    hostname: agent-ubuntu-2
    environment:
      <<: *agent-env
      AGENT_MANAGER_DATA_HOST: wazuh-worker2
      AGENT_MANAGER_DATA_HOST_FALLBACK: wazuh-worker1
    volumes: *agent-config-mounts
    depends_on:
      wazuh-worker2:
        condition: service_healthy
    networks:
      lab:
        ipv4_address: 172.28.0.22

  agent-rocky-1:
    build:
      context: ../..
      dockerfile: deploy/lab/agent-rocky.Dockerfile
    image: shadowtracer-lab/agent-rocky:local
    hostname: agent-rocky-1
    environment:
      <<: *agent-env
      AGENT_MANAGER_DATA_HOST: wazuh-worker1
    volumes: *agent-config-mounts
    depends_on:
      wazuh-worker1:
        condition: service_healthy
    networks:
      lab:
        ipv4_address: 172.28.0.23

  agent-rocky-2:
    build:
      context: ../..
      dockerfile: deploy/lab/agent-rocky.Dockerfile
    image: shadowtracer-lab/agent-rocky:local
    hostname: agent-rocky-2
    environment:
      <<: *agent-env
      AGENT_MANAGER_DATA_HOST: wazuh-worker2
    volumes: *agent-config-mounts
    depends_on:
      wazuh-worker2:
        condition: service_healthy
    networks:
      lab:
        ipv4_address: 172.28.0.24

networks:
  lab:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
