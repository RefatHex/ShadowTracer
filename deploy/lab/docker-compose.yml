name: shadowtracer-lab

x-manager-build: &manager-build
  context: ../..
  dockerfile: deploy/lab/manager.Dockerfile

# Phase 3 follow-up 3: agents go through shadowtracer-lb, registered with
# a dynamic ("any") IP. Previously (Phase 1/2, see PHASE1_FINDINGS.md)
# classic Wazuh TCP secure mode failed to identify "any"-registered agents
# behind a shared-IP load balancer - traced in Phase 3 to a real bug
# (OS_IsValidIP()/isSingleHost() in src/shared/validate_op.c, see
# UPSTREAM.md), now fixed and re-verified: Phase 1 item 15 (20 events
# during a worker outage) re-run through the LB, 20/20 delivered.
x-agent-env: &agent-env
  MANAGER_ENROLL_HOST: wazuh-master
  ENROLL_PASSWORD: ${ENROLL_PASSWORD:?set ENROLL_PASSWORD in deploy/lab/.env}

# Phase 4 Step 7: 2 byte-identical console backend replicas (same image,
# same env, nothing replica-specific) share this block - Caddy round-robins
# between them, and the console being stateless means it doesn't matter
# which one answers a given request.
x-console-backend-env: &console-backend-env
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in deploy/lab/.env}
  APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in deploy/lab/.env}
  POSTGRES_HOST: postgres
  POSTGRES_DB: ${POSTGRES_DB:-shadowtracer}
  CLICKHOUSE_HOST: ch-clickhouse-1
  CLICKHOUSE_USER: ${CLICKHOUSE_USER:?set CLICKHOUSE_USER in deploy/lab/.env}
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in deploy/lab/.env}
  CLICKHOUSE_DATABASE: shadowtracer
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  KAFKA_WRITER_GROUP: shadowtracer-writer
  CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-https://localhost:8443}
  # Phase 3's shipper/writer run as host processes, not containers (see
  # PHASE3_DATA_PLATFORM.md) - host.docker.internal is how a container
  # reaches them for /health/detail's shipper-lag polling.
  SHIPPER_METRICS_URLS: http://host.docker.internal:9101,http://host.docker.internal:9103

services:
  wazuh-master:
    build: *manager-build
    image: shadowtracer-lab/manager:local
    hostname: wazuh-master
    init: true
    environment:
      CLUSTER_NODE_TYPE: master
      CLUSTER_NODE_NAME: master
      CLUSTER_KEY: ${CLUSTER_KEY:?set CLUSTER_KEY in deploy/lab/.env}
      ENROLL_PASSWORD: ${ENROLL_PASSWORD:?set ENROLL_PASSWORD in deploy/lab/.env}
    volumes: &manager-config-mounts
      - ./entrypoint-manager.sh:/entrypoint.sh:ro
      - ./healthcheck-manager.sh:/healthcheck.sh:ro
    ports:
      # Only the API goes to the host - 1514/1515 stay internal to the lab
      # network (the Windows host has had Hyper-V reserve those before).
      - "127.0.0.1:55000:55000"
    networks:
      lab:
        ipv4_address: 172.28.0.10

  wazuh-worker1:
    build: *manager-build
    image: shadowtracer-lab/manager:local
    hostname: wazuh-worker1
    init: true
    environment:
      CLUSTER_NODE_TYPE: worker
      CLUSTER_NODE_NAME: worker1
      CLUSTER_KEY: ${CLUSTER_KEY:?set CLUSTER_KEY in deploy/lab/.env}
      ENROLL_PASSWORD: ${ENROLL_PASSWORD:?set ENROLL_PASSWORD in deploy/lab/.env}
    volumes:
      - ./entrypoint-manager.sh:/entrypoint.sh:ro
      - ./healthcheck-manager.sh:/healthcheck.sh:ro
      # Phase 3: the shipper (shadowtracer/ingest) tails this from the host
      # - one shipper process per manager node, per Step 3.
      - ./alerts-worker1:/var/ossec/logs/alerts
    depends_on:
      wazuh-master:
        condition: service_healthy
    networks:
      lab:
        ipv4_address: 172.28.0.11

  wazuh-worker2:
    build: *manager-build
    image: shadowtracer-lab/manager:local
    hostname: wazuh-worker2
    init: true
    environment:
      CLUSTER_NODE_TYPE: worker
      CLUSTER_NODE_NAME: worker2
      CLUSTER_KEY: ${CLUSTER_KEY:?set CLUSTER_KEY in deploy/lab/.env}
      ENROLL_PASSWORD: ${ENROLL_PASSWORD:?set ENROLL_PASSWORD in deploy/lab/.env}
    volumes:
      - ./entrypoint-manager.sh:/entrypoint.sh:ro
      - ./healthcheck-manager.sh:/healthcheck.sh:ro
      - ./alerts-worker2:/var/ossec/logs/alerts
    depends_on:
      wazuh-master:
        condition: service_healthy
    networks:
      lab:
        ipv4_address: 172.28.0.12

  # Agent event traffic (1514) load balancer. Kept running per the Step 2
  # spec, but agent traffic bypasses it - see the note above x-agent-env.
  shadowtracer-lb:
    image: haproxy:2.9-alpine
    hostname: shadowtracer-lb
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - wazuh-worker1
      - wazuh-worker2
    networks:
      lab:
        ipv4_address: 172.28.0.13

  agent-ubuntu-1:
    build:
      context: ../..
      dockerfile: deploy/lab/agent-ubuntu.Dockerfile
    image: shadowtracer-lab/agent-ubuntu:local
    hostname: agent-ubuntu-1
    init: true
    environment:
      <<: *agent-env
      # Phase 3 follow-up 3: through shadowtracer-lb now that the real bug
      # (OS_IsValidIP()/isSingleHost()) is fixed - no per-agent fallback
      # <server> needed any more, HAProxy's own health check routes around
      # a dead worker without the agent having to do anything.
      AGENT_MANAGER_DATA_HOST: shadowtracer-lb
    volumes: &agent-config-mounts
      - ./entrypoint-agent.sh:/entrypoint.sh:ro
      - ./healthcheck-agent.sh:/healthcheck.sh:ro
    depends_on:
      shadowtracer-lb:
        condition: service_started
    networks:
      lab:
        ipv4_address: 172.28.0.21

  agent-ubuntu-2:
    build:
      context: ../..
      dockerfile: deploy/lab/agent-ubuntu.Dockerfile
    image: shadowtracer-lab/agent-ubuntu:local
    hostname: agent-ubuntu-2
    init: true
    environment:
      <<: *agent-env
      AGENT_MANAGER_DATA_HOST: shadowtracer-lb
    volumes: *agent-config-mounts
    depends_on:
      shadowtracer-lb:
        condition: service_started
    networks:
      lab:
        ipv4_address: 172.28.0.22

  agent-rocky-1:
    build:
      context: ../..
      dockerfile: deploy/lab/agent-rocky.Dockerfile
    image: shadowtracer-lab/agent-rocky:local
    hostname: agent-rocky-1
    init: true
    environment:
      <<: *agent-env
      AGENT_MANAGER_DATA_HOST: shadowtracer-lb
    volumes: *agent-config-mounts
    depends_on:
      shadowtracer-lb:
        condition: service_started
    networks:
      lab:
        ipv4_address: 172.28.0.23

  agent-rocky-2:
    build:
      context: ../..
      dockerfile: deploy/lab/agent-rocky.Dockerfile
    image: shadowtracer-lab/agent-rocky:local
    hostname: agent-rocky-2
    init: true
    environment:
      <<: *agent-env
      AGENT_MANAGER_DATA_HOST: shadowtracer-lb
    volumes: *agent-config-mounts
    depends_on:
      shadowtracer-lb:
        condition: service_started
    networks:
      lab:
        ipv4_address: 172.28.0.24

  # --- Phase 3 data platform ---------------------------------------------

  kafka:
    image: apache/kafka:3.9.0
    hostname: kafka
    mem_limit: 768m
    environment:
      CLUSTER_ID: "${KAFKA_CLUSTER_ID:?set KAFKA_CLUSTER_ID in deploy/lab/.env, see .env.example}"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://127.0.0.1:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # Lab: 1 broker, so replication/ISR must be 1. Production (3 brokers)
      # uses the real defaults (3/2) - see shadowtracer/docs/DECISIONS.md.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms512m"
    volumes:
      - kafka-data:/var/lib/kafka/data
    ports:
      - "127.0.0.1:9094:9094"
    networks:
      lab:
        ipv4_address: 172.28.0.30

  ch-keeper:
    image: clickhouse/clickhouse-keeper:24.8
    hostname: ch-keeper
    mem_limit: 256m
    volumes:
      - ./clickhouse/keeper/keeper_config.xml:/etc/clickhouse-keeper/keeper_config.xml:ro
      - ch-keeper-data:/var/lib/clickhouse
    networks:
      lab:
        ipv4_address: 172.28.0.31

  ch-clickhouse-1:
    image: clickhouse/clickhouse-server:24.8
    hostname: ch-clickhouse-1
    mem_limit: 2304m
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:?set CLICKHOUSE_USER in deploy/lab/.env}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in deploy/lab/.env}
      CLICKHOUSE_DB: shadowtracer
    volumes:
      - ./clickhouse/config.d/zookeeper.xml:/etc/clickhouse-server/config.d/zookeeper.xml:ro
      - ./clickhouse/config.d/cluster.xml:/etc/clickhouse-server/config.d/cluster.xml:ro
      - ./clickhouse/config.d/resources.xml:/etc/clickhouse-server/config.d/resources.xml:ro
      - ./clickhouse/config.d/storage.xml:/etc/clickhouse-server/config.d/storage.xml:ro
      - ./clickhouse/config.d/macros-1.xml:/etc/clickhouse-server/config.d/macros.xml:ro
      - ch1-data:/var/lib/clickhouse
    depends_on:
      - ch-keeper
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"
    networks:
      lab:
        ipv4_address: 172.28.0.32

  ch-clickhouse-2:
    image: clickhouse/clickhouse-server:24.8
    hostname: ch-clickhouse-2
    mem_limit: 2304m
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:?set CLICKHOUSE_USER in deploy/lab/.env}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in deploy/lab/.env}
      CLICKHOUSE_DB: shadowtracer
    volumes:
      - ./clickhouse/config.d/zookeeper.xml:/etc/clickhouse-server/config.d/zookeeper.xml:ro
      - ./clickhouse/config.d/cluster.xml:/etc/clickhouse-server/config.d/cluster.xml:ro
      - ./clickhouse/config.d/resources.xml:/etc/clickhouse-server/config.d/resources.xml:ro
      - ./clickhouse/config.d/storage.xml:/etc/clickhouse-server/config.d/storage.xml:ro
      - ./clickhouse/config.d/macros-2.xml:/etc/clickhouse-server/config.d/macros.xml:ro
      - ch2-data:/var/lib/clickhouse
    depends_on:
      - ch-keeper
    ports:
      - "127.0.0.1:8124:8123"
      - "127.0.0.1:9001:9000"
    networks:
      lab:
        ipv4_address: 172.28.0.33

  postgres:
    image: postgres:16-alpine
    hostname: postgres
    mem_limit: 256m
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in deploy/lab/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/lab/.env}
      POSTGRES_DB: ${POSTGRES_DB:-shadowtracer}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      lab:
        ipv4_address: 172.28.0.34

  # --- Phase 4 console ------------------------------------------------

  console-backend-1:
    build:
      context: ../..
      dockerfile: deploy/lab/console-backend.Dockerfile
    image: shadowtracer-lab/console-backend:local
    hostname: console-backend-1
    environment: *console-backend-env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_started
      ch-clickhouse-1:
        condition: service_started
      kafka:
        condition: service_started
    networks:
      lab:
        ipv4_address: 172.28.0.35

  console-backend-2:
    build:
      context: ../..
      dockerfile: deploy/lab/console-backend.Dockerfile
    image: shadowtracer-lab/console-backend:local
    hostname: console-backend-2
    environment: *console-backend-env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_started
      ch-clickhouse-1:
        condition: service_started
      kafka:
        condition: service_started
    networks:
      lab:
        ipv4_address: 172.28.0.36

  caddy:
    build:
      context: ../..
      dockerfile: deploy/lab/console-caddy.Dockerfile
    image: shadowtracer-lab/console-caddy:local
    hostname: caddy
    depends_on:
      - console-backend-1
      - console-backend-2
    ports:
      - "127.0.0.1:8443:8443"
    networks:
      lab:
        ipv4_address: 172.28.0.37

networks:
  lab:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  kafka-data:
  ch-keeper-data:
  ch1-data:
  ch2-data:
  postgres-data:
