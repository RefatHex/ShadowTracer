global
    maxconn 4096

# 6.1c follow-up: worker1/worker2 run only in the "ha" compose profile. Docker's DNS lets
# haproxy start without them (init-addr none) and pick them up when they appear.
resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 10s

defaults
    mode tcp
    default-server init-addr last,libc,none resolvers docker
    timeout connect 5s
    timeout client 2m
    timeout server 2m

# Agent event traffic (1514) is load-balanced across the two workers.
# Enrollment (1515) is NOT proxied here - agents enroll with the master
# directly, per the Phase 1 task spec.
#
# Phase 5C Step 0b: `balance source` + `hash-type consistent` make a
# given agent's connections land on the same worker every time, as long
# as the worker set doesn't change - this is the mitigation, not the
# fix. It reduces how OFTEN an agent's traffic crosses workers
# mid-stream (no more gratuitous reassignment on a fresh TCP connection
# with nothing actually wrong), which is the real-world common case this
# lab's own agents hit on every reconnect under plain roundrobin.
#
# It does NOT eliminate the underlying race the sequence-lateness-window
# fix (sequences.py) exists for: a real worker failure or restart still
# moves that worker's agents to the survivor (the whole reason this LB
# exists - Phase 1 item 15's failover test), and `consistent` hashing
# only bounds that move to the agents that were actually on the lost
# worker, not to zero moves. A source-IP hash is also only as stable as
# the source IP itself - fine in this lab (agents have static container
# IPs), not a guarantee behind a NAT/proxy that can change an agent's
# apparent source IP between connections in a real deployment.
frontend agents_1514
    bind *:1514
    default_backend workers_1514

backend workers_1514
    balance source
    hash-type consistent
    server worker1 shadowtracer-worker1:1514 check
    server worker2 shadowtracer-worker2:1514 check
    # Only when no worker is up: the default profile (no workers), or both down in "ha".
    server master shadowtracer-master:1514 check backup
